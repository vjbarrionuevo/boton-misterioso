<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Feliz Día, Profe!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff9f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #landing, #celebracion {
    width: 100%;
    max-width: 420px;
    padding: 2.5rem 1.75rem;
    text-align: center;
  }
  #celebracion { display: none; }
  .icon { font-size: 56px; margin-bottom: 1rem; animation: heartbeat 1.8s ease-in-out infinite; }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    15% { transform: scale(1.18); }
    30% { transform: scale(1); }
    45% { transform: scale(1.1); }
    60% { transform: scale(1); }
  }
  .tagline { font-size: 16px; color: #666; margin-bottom: 2rem; line-height: 1.6; }
  #btn-sorpresa {
    background: #1a1a1a; color: #fff; border: none;
    border-radius: 14px; padding: 16px 36px;
    font-size: 17px; font-weight: 500; cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
  }
  #btn-sorpresa:hover { opacity: 0.85; transform: scale(1.03); }
  #btn-sorpresa:active { transform: scale(0.97); }
  .emoji-row { font-size: 38px; margin-bottom: 1.25rem; letter-spacing: 6px; animation: pop 0.6s ease; }
  .titulo { font-size: 28px; font-weight: 700; color: #1a1a1a; line-height: 1.2; margin-bottom: 0.6rem; animation: aparecer 0.6s ease forwards; }
  .subtitulo { font-size: 16px; color: #555; margin-bottom: 1.5rem; line-height: 1.6; animation: aparecer 0.8s ease forwards; }
  .foto-container {
    margin: 0 auto 1.5rem;
    width: 220px; height: 220px;
    border-radius: 50%; overflow: hidden;
    border: 4px solid #f7c948;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    animation: aparecer 1s ease forwards;
  }
  .foto-container img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  .firma { font-size: 15px; color: #888; font-style: italic; animation: aparecer 1.2s ease forwards; }
  @keyframes aparecer {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
  }
  canvas#confetti-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 999;
  }
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div id="landing">
  <div class="icon">🎓</div>
  <p class="tagline">Hay alguien que te tiene preparada<br>una pequeña sorpresa.</p>
  <button id="btn-sorpresa">Hacé click acá 🎁</button>
</div>
